[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-tool-server-and-task-agent"
version = "0.1.0"
description = "Bodhan MCP tool server and task agent"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "mcp==1.30.0",
  "openai==1.82.0",
  "pdf2image==1.17.0",
  "pymupdf==1.26.6",
  "pillow==13.0.0",
  "pydub==0.25.1",
  "pydantic==2.12.5",
  "python-dotenv==1.1.0",
  "tenacity==9.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.11.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["bodhan_mcp*", "bodhan_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
